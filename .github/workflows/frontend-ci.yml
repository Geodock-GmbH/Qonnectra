name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        run: cp .env.example .env

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Verify generated API types are up to date
        run: |
          npm run generate:types
          git diff --exit-code src/lib/types/api.d.ts \
            || { echo "::error::src/lib/types/api.d.ts is out of date. Run 'npm run generate:types' after regenerating backend/schema.yml and commit the result."; exit 1; }

      - name: Unit tests (vitest)
        run: npm test
        env:
          TZ: Europe/Berlin
