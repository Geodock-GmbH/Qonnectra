          description: ''
  /api/v1/fiber-splice/unmerge-ports/:
    post:
      operationId: fiber_splice_unmerge_ports_create
      description: |-
        Remove specific ports from a merge group on a specific side.
        Sets merge_group_a or merge_group_b to NULL for specified ports.
        If only one port remains in group, unmerges that one too.

        When unmerging, converts the shared fiber back to an individual fiber
        on the first unmerged port, then clears shared fibers for that side only.
      tags:
      - fiber-splice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiberSplice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FiberSplice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FiberSplice'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiberSplice'
          description: ''
  /api/v1/fiber-splice/upsert/:
    post:
      operationId: fiber_splice_upsert_create
      description: |-
        Create or update a fiber splice connection.
        Specify which side ('a' or 'b') the fiber should be placed on.

        If the port is part of a merge group on this side,
        the fiber becomes a SHARED fiber for all ports in the group.

        Can also connect a residential unit instead of a fiber/cable pair.
      tags:
      - fiber-splice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiberSplice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FiberSplice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FiberSplice'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiberSplice'
          description: ''
  /api/v1/fiber-splice/upsert-merged/:
    post:
      operationId: fiber_splice_upsert_merged_create
      description: |-
        Upsert fibers to a merge group on a specific side.

        Behavior depends on whether the merge group is on this side:
        - If dropping on the MERGED side (this side has the merge group):
        Use the FIRST fiber as the shared fiber for all ports in the group
        - If dropping on the OTHER side (not merged on this side):
        Fill individual fibers sequentially across ports
      tags:
      - fiber-splice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiberSplice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FiberSplice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FiberSplice'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiberSplice'
          description: ''
