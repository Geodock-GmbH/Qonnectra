  /api/v1/wms-sources/access_token/:
    get:
      operationId: wms_sources_access_token_retrieve
      description: |-
        Get a short-lived access token for WMS tile requests.

        This token can be passed as a query parameter to the WMS proxy
        to authenticate tile requests that can't use cookies (due to
        SameSite restrictions on cross-origin image requests).

        The token includes a 'wms_only' claim to scope it specifically
        for WMS proxy requests, preventing misuse on other endpoints.
      tags:
      - wms-sources
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WMSSource'
          description: ''
components:
  schemas:
    Address:
      type: object
      description: |-
        Serialize :model:`api.Address` as GeoJSON with nested attribute objects.

        Geometry is validated as Point in EPSG:25832. Includes a read-only
        geom_3857 field for web map display.
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureEnum'
        id:
          type: string
          format: uuid
          readOnly: true
        geometry:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        properties:
          type: object
          properties:
            status_development:
              allOf:
              - $ref: '#/components/schemas/AttributesStatusDevelopment'
              readOnly: true
            flag:
              allOf:
              - $ref: '#/components/schemas/Flags'
              readOnly: true
            project:
              allOf:
              - $ref: '#/components/schemas/Projects'
              readOnly: true
            id_address:
              type: string
              title: Adress-ID
              maxLength: 7
            id_address_2:
              type: string
              nullable: true
              title: Adress-ID 2
              maxLength: 7
            zip_code:
              type: string
              title: PLZ
            city:
              type: string
              title: Stadt
            district:
              type: string
              title: Ortsteil
            street:
              type: string
              title: Straße
            housenumber:
              type: integer
              title: Hausnummer
            house_number_suffix:
              type: string
              title: Hausnummer
            status_development_id:
              type: integer
              writeOnly: true
              title: Ausbaustatus
            flag_id:
              type: integer
              writeOnly: true
              title: Kennzeichen
            project_id:
              type: integer
              writeOnly: true
              title: Projekt
            geom_3857:
              readOnly: true
    AddressList:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureCollectionEnum'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    Area:
      type: object
      description: Serialize :model:`api.Area` as GeoJSON with Polygon geometry validation.
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureEnum'
        id:
          type: string
          format: uuid
          readOnly: true
        geometry:
          type: object
          properties:
            type:
              type: string
              enum:
              - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: float
                  example:
                  - 12.9721
                  - 77.5933
                  minItems: 2
                  maxItems: 3
                example:
                - - 22.4707
                  - 70.0577
                - - 12.9721
                  - 77.5933
                minItems: 4
              example:
              - - - 0.0
                  - 0.0
                - - 0.0
                  - 50.0
                - - 50.0
                  - 50.0
                - - 50.0
                  - 0.0
                - - 0.0
                  - 0.0
        properties:
          type: object
          properties:
            area_type:
              allOf:
              - $ref: '#/components/schemas/AttributesAreaType'
              readOnly: true
            flag:
              allOf:
              - $ref: '#/components/schemas/Flags'
              readOnly: true
            project:
              allOf:
              - $ref: '#/components/schemas/Projects'
              readOnly: true
            area_type_id:
              type: integer
              writeOnly: true
              title: Gebietstyp
            flag_id:
              type: integer
              writeOnly: true
              title: Kennzeichen
            project_id:
              type: integer
              writeOnly: true
              title: Projekt
            name:
              type: string
              title: Gebietname
            geom_3857:
              type: string
              readOnly: true
    AreaList:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureCollectionEnum'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Area'
    AttributesAreaType:
      type: object
      description: Serialize :model:`api.AttributesAreaType` instances.
      properties:
        id:
          type: integer
          readOnly: true
        area_type:
          type: string
          title: Gebietstyp
      required:
      - area_type
      - id
    AttributesCableType:
      type: object
      description: Serialize :model:`api.AttributesCableType` instances.
      properties:
        id:
          type: integer
          readOnly: true
        cable_type:
          type: string
          title: Kabeltyp
      required:
      - cable_type
      - id
    AttributesCompany:
      type: object
      description: Serialize :model:`api.AttributesCompany` instances.
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: string
          title: Firma
        city:
          type: string
          nullable: true
          title: Stadt
        postal_code:
          type: string
          nullable: true
          title: Postleitzahl
        street:
          type: string
          nullable: true
          title: Straße
        housenumber:
          type: string
          nullable: true
          title: Hausnummer
        phone:
          type: string
          nullable: true
          title: Telefon
        email:
          type: string
          nullable: true
          title: E-Mail
      required:
      - company
      - id
    AttributesComponentStructure:
      type: object
      description: Serialize :model:`api.AttributesComponentStructure` port definitions.
      properties:
        id:
          type: integer
          readOnly: true
        component_type:
          type: integer
          title: Komponententyp
        in_or_out:
          allOf:
          - $ref: '#/components/schemas/InOrOutEnum'
          title: In oder Out
        port:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        port_alias:
          type: string
          nullable: true
      required:
      - component_type
      - id
      - in_or_out
      - port
    AttributesComponentType:
      type: object
      description: Serialize :model:`api.AttributesComponentType` instances.
      properties:
        id:
          type: integer
          readOnly: true
        component_type:
          type: string
          title: Komponententyp
          description: Der Typ der Komponente (z.B. 'Router', 'Switch', 'Access Point',
            etc.)
        occupied_slots:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Belegte Steckplätze
          description: 'Anzahl der von der Komponente belegten Steckplätze (Standard:
            1)'
        manufacturer:
          type: integer
          nullable: true
          title: Hersteller
          description: Der Hersteller der Komponente
      required:
      - component_type
      - id
    AttributesConduitType:
      type: object
      description: Serialize :model:`api.AttributesConduitType` instances.
      properties:
        id:
          type: integer
          readOnly: true
        conduit_type:
          type: string
          title: Rohrtyp
        conduit_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Rohrzahl
        conduit_type_alias:
          type: string
          nullable: true
          title: Rohrtyp-Alias
        conduit_type_microduct:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: Rohrtyp-Microduct
      required:
      - conduit_count
      - conduit_type
      - id
    AttributesConstructionType:
      type: object
      description: Serialize :model:`api.AttributesConstructionType` instances.
      properties:
        id:
          type: integer
          readOnly: true
        construction_type:
          type: string
          title: Bau-/Verlegeart
      required:
      - construction_type
      - id
    AttributesFiberColor:
      type: object
      description: Serialize :model:`api.AttributesFiberColor` with hex codes.
      properties:
        id:
          type: integer
          readOnly: true
        name_de:
          type: string
          title: Deutscher Name
          description: Deutscher Farbname (z.B., 'rot', 'rot-weiss')
          maxLength: 50
        name_en:
          type: string
          title: Englischer Name
          description: Englischer Farbname (z.B., 'red', 'red-white')
          maxLength: 50
        hex_code:
          type: string
          title: Farbcode
          description: Primärer CSS-Farbcode (z.B., '#dc2626')
          maxLength: 7
        hex_code_secondary:
          type: string
          nullable: true
          title: Sekundärer CSS-Farbcode
          description: Sekundäre Farbe für gestreifte/zweilagige Mikrorohre/Fasern
            (optional)
          maxLength: 7
        display_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Anzeigereihenfolge
          description: Reihenfolge, in der Farben in Auswahllisten angezeigt werden
        is_active:
          type: boolean
          title: Aktiv
          description: Inaktive Farben werden ausgeblendet, aber für bestehende Daten
