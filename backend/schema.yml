                {"node_structure_uuid": "...", "port_number": 2, "side": "b",
                 "residential_unit_uuid": "..."},
                ...
            ]
        }

        Returns: {
            "created": [...],  # Successfully created/updated splices
            "failed": [{"port_number": 5, "error": "..."}]  # Failed splices
        }
      tags:
      - fiber-splice
      requestBody:
        content:
          application/json:
