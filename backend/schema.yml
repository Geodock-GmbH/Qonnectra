    Trench:
      type: object
      description: |-
        Serialize :model:`api.Trench` as GeoJSON with nested attribute objects.

        Read operations return nested serializers for FK fields (surface,
        construction_type, status, etc.). Write operations accept PK references
        via write-only fields. Geometry is validated as LineString in EPSG:25832.
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureEnum'
        id:
          type: string
          format: uuid
          readOnly: true
        geometry:
          type: object
          properties:
            type:
              type: string
              enum:
              - LineString
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: number
                  format: float
                example:
                - 12.9721
                - 77.5933
                minItems: 2
                maxItems: 3
              example:
              - - 22.4707
                - 70.0577
              - - 12.9721
                - 77.5933
              minItems: 2
        properties:
          type: object
          properties:
            id_trench:
              type: string
              readOnly: true
            house_connection:
              type: boolean
              readOnly: true
            length:
              type: string
              format: decimal
              pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
              readOnly: true
            surface:
              allOf:
              - $ref: '#/components/schemas/AttributesSurface'
              readOnly: true
            construction_type:
              allOf:
              - $ref: '#/components/schemas/AttributesConstructionType'
              readOnly: true
            status:
              allOf:
              - $ref: '#/components/schemas/AttributesStatus'
              readOnly: true
            phase:
              allOf:
              - $ref: '#/components/schemas/AttributesPhase'
              readOnly: true
            owner:
              allOf:
              - $ref: '#/components/schemas/AttributesCompany'
              readOnly: true
            constructor:
              allOf:
              - $ref: '#/components/schemas/AttributesCompany'
              readOnly: true
            project:
              allOf:
              - $ref: '#/components/schemas/Projects'
              readOnly: true
            flag:
              allOf:
              - $ref: '#/components/schemas/Flags'
              readOnly: true
            surface_value:
              type: integer
              writeOnly: true
              title: Oberfläche
            construction_type_id:
              type: integer
              writeOnly: true
              title: Bau-/Verlegeart
            construction_depth:
              type: integer
              title: Bautiefe
            construction_details:
              type: string
              title: Baudetails
            status_id:
              type: integer
              writeOnly: true
              title: Status
            phase_id:
              type: integer
              writeOnly: true
              title: Phase
            internal_execution:
              type: boolean
              title: Eigenleistung
            funding_status:
              type: boolean
              title: Förderstatus
            trench_owner:
              type: integer
              writeOnly: true
              title: Eigentümer
            trench_company:
              type: integer
              writeOnly: true
              title: Firma
            trench_constructor:
              type: integer
              writeOnly: true
              title: Baufirma
            date:
              type: string
              format: date
              title: Datum
            comment:
              type: string
              title: Kommentar
            project_id:
              type: integer
              writeOnly: true
              title: Projekt
            flag_id:
              type: integer
              writeOnly: true
              title: Kennzeichen
            geom_3857:
              type: string
              readOnly: true
