  /api/v1/spatial/intersects/:
    post:
      operationId: spatial_intersects_create
      description: |-
        Intersect the request geometry against the requested layers.

        URL: /api/v1/spatial/intersects/
        Body (JSON): {
            "geom": GeoJSON geometry (assumed EPSG:25832 unless "srid" is set),
            "layers": [str, ...]  (optional; defaults to all layers),
            "project": int        (optional; scopes results to one project),
            "exclude_projects": "3,7" | [3, 7]  (optional; drops these
                projects; combines with "project"),
            "srid": int           (optional; source SRID of "geom")
        }

        Returns:
            Response: {
                "srid": int,
                "layers": {<layer>: FeatureCollection, ...},
                "counts": {<layer>: int, ...},
                "total": int
            }
      tags:
      - spatial
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpatialIntersectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpatialIntersectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpatialIntersectRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpatialIntersectResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpatialIntersectError'
          description: Invalid geometry or layer request.
