  /api/v1/address/{uuid}/fiber-connections/:
    get:
      operationId: address_fiber_connections_retrieve
      description: |-
        Get all fiber connections for all residential units of this address.
        Returns a dict mapping unit UUID to its fiber connections.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Adresse.
        required: true
