[project]
name = "backend"
version = "1.7.0"
description = "Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-rest-auth>=7.0.1",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.6.0",
    "django-cors-headers>=4.6.0",
    "django-json-widget>=2.0.0",
    "djangorestframework>=3.15.2",
    "djangorestframework-gis>=1.1",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-spectacular>=0.27",
    "docutils>=0.21.2",
    "geopandas>=1.1.0",
    "gunicorn>=23.0.0",
    "networkx>=3.4.2",
    "openpyxl>=3.1.5",
    "pathvalidate>=3.3.1",
    "psycopg[binary]>=3.2.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
    "owslib>=0.31.0",
    "cryptography>=42.0.0",
    "django-simple-history>=3.11.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.11.1",
    "ruff>=0.11.4",
]

[tool.coverage.run]
source = ["apps.api"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/apps.py",
    "*/admin.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
